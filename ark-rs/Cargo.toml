[package]
name = "ark-rs"
version = "0.10.1"
categories = { workspace = true }
edition = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = "1.86"
description = "Rust crates for building Bitcoin wallets and applications with Arkade"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
ark-client = { path = "../ark-client", version = "0.10.1", optional = true, default-features = false }
ark-core = { path = "../ark-core", version = "0.10.1" }
ark-grpc = { path = "../ark-grpc", version = "0.10.1", optional = true, default-features = false }

[features]
default = ["tls-native-roots"]
client = ["ark-client"]
grpc = ["ark-grpc"]

# Forward ark-client features
sqlite = ["ark-client/sqlite"]

# Forward TLS features to both ark-client and ark-grpc
tls-native-roots = ["ark-client?/tls-native-roots", "ark-grpc?/tls-native-roots"]
tls-webpki-roots = ["ark-client?/tls-webpki-roots", "ark-grpc?/tls-webpki-roots"]
